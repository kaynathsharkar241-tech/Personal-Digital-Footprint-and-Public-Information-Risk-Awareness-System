{% extends "base.html" %}
{% block title %}Recovery{% endblock %}
{% block heading %}Use a recovery code{% endblock %}
{% block body %}
<p class="sub">Each code works once. After signing in, add a new passkey on your current device.</p>
<label for="rec-nickname">Nickname</label>
<input id="rec-nickname" type="text" autocomplete="username" maxlength="30">
<label for="rec-code">Recovery code</label>
<input id="rec-code" type="text" placeholder="XXXX-XXXX" autocapitalize="characters" autocomplete="off" maxlength="9">
<button id="recovery-btn" class="primary">Sign in</button>
<p class="links"><a href="{{ url_for('auth.login_page') }}">Back to sign in</a></p>
{% endblock %}
