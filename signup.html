{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block heading %}Create your account{% endblock %}
{% block body %}
<p class="sub">No email or password needed. You'll use Face ID, fingerprint or your device screen lock.</p>
<label for="nickname">Choose a nickname <span class="hint">(not your real name)</span></label>
<input id="nickname" type="text" autocomplete="username webauthn" maxlength="30" required>
<button id="signup-btn" class="primary">Continue with Face ID</button>
<p class="links">Already have an account? <a href="{{ url_for('auth.login_page') }}">Sign in</a></p>
{% endblock %}
